server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payment_mvp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: n3u3da!
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2

payment:
  currency:
    base: USD
    usd-to-usd: 1.0
    eur-to-usd: 1.08
    gbp-to-usd: 1.27
    inr-to-usd: 0.012
  send:
    success-rate: 0.8
    max-retries: 3
    backoff-base-millis: 1000
  limits:
    max-transaction-amount: 10000
  intent:
    expiry-minutes: 30
  single-user:
    email: single.user@local
    full-name: Single User
    account-number: ACC-001

springdoc:
  swagger-ui:
    path: /swagger-ui.html
