server.port=8080

# Docker datasource — uses 'mysql' service hostname and environment variables
spring.datasource.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:payment_mvp}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:tms_user}
spring.datasource.password=${MYSQL_PASSWORD:tms_password}
